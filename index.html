<script>
(function(){
const D={
  l0:'【環境→科技】氣候修復期的行星級運算需求，是 ASI 被允許全域接管的物理前提',
  l1:'【環境→科技】大雪山地形（地下水層與峽谷煙囪效應）直接決定量子冷卻節點的選址',
  l2:'【環境→個人】地表 60°C 高溫封閉人類，虛擬感官代償成為唯一能接觸「外部世界」的形式',
  l3:'【環境→個人】廢土地帶提醒居民：真實世界等於死亡威脅，矛盾地強化了主體性焦慮',
  l4:'【科技→個人】ASI 全域管理直接供給感官代償矩陣，食物、氣候、視覺全部合成化，個體失去對「真實感官」的參照系',
  l5:'【科技→個人】BCI 使感知邊界模糊——個體無法確認哪些反應是「真正的自己」，哪些是系統輸入',
  l6:'【科技→社會】ASI 消除物質衝突後，人類的競爭慾轉向無實際後果的虛擬品味聖戰',
  l7:'【科技→社會】物質編譯消除傳統稀缺性，審美話語取代物質成為新的符號資本競技場（布迪厄「符號暴力」）',
  l8:'【科技→社會】量子冷卻節點是峽谷城維生命脈，零四等居民向其跪拜，祈求「系統偶爾出錯」',
  l9:'【個人→社會，正回饋】主體性焦慮→神經部落化：越不確定自身存在，越需要群體衝突來確認「我還在」',
  l10:'【社會→個人，正回饋】神經部落化→主體性焦慮：部落衝突消退後，存在的虛無感更深，惡性循環成立',
  l11:'【個人→社會】時間通膨（壽命 150+）創造無盡空閒，炫耀性時間消費——以失敗次數計算物品價值——成為填補虛無的集體儀式',
  l12:'【個人→社會】個人瑕疵崇拜在社會層面集體化，轉化為對量子節點陣列的「機魂崇拜」'
};
const LB={
  env1:'地表極端高溫',env2:'深層冷卻峽谷',env3:'氣候修復期',env4:'廢土地帶',
  tec1:'ASI 全域管理',tec2:'物質編譯技術',tec3:'腦機介面 BCI',tec4:'量子冷卻節點',
  ind1:'感官代償依賴',ind2:'主體性焦慮',ind3:'時間通膨',ind4:'瑕疵崇拜',
  soc1:'神經部落化',soc2:'機魂崇拜',soc3:'炫耀性時間消費',soc4:'審美話語爭奪'
};
const GC={env:'#0C447C',tec:'#3C3489',ind:'#085041',soc:'#633806'};
const NL={
  env1:['l2'],env2:['l1'],env3:['l0'],env4:['l3'],
  tec1:['l0','l4','l6'],tec2:['l7'],tec3:['l5'],tec4:['l1','l8'],
  ind1:['l2','l4'],ind2:['l3','l5','l9','l10'],ind3:['l11'],ind4:['l12'],
  soc1:['l6','l9','l10'],soc2:['l8','l12'],soc3:['l11'],soc4:['l7']
};
const ALL=['env1','env2','env3','env4','tec1','tec2','tec3','tec4','ind1','ind2','ind3','ind4','soc1','soc2','soc3','soc4'];
let sel=null;
function hn(id){
  if(sel===id){sel=null;rst();document.getElementById('cm-inf').textContent='點擊任意節點，查看它與其他要素的關聯路徑';return;}
  sel=id;
  const my=new Set(NL[id]||[]);
  const cn=new Set([id]);
  my.forEach(lid=>{ALL.forEach(nid=>{if((NL[nid]||[]).includes(lid))cn.add(nid);});});
  for(let i=0;i<=12;i++){const e=document.getElementById('l'+i);if(!e)continue;if(my.has('l'+i)){e.setAttribute('opacity','0.92');e.setAttribute('stroke-width','2.5');}else{e.setAttribute('opacity','0.025');}}
  ALL.forEach(nid=>{const e=document.getElementById('n-'+nid);if(!e)return;const r=e.querySelector('rect');if(cn.has(nid)){e.style.opacity='1';r.setAttribute('stroke-width',nid===id?'2.5':'1.5');}else{e.style.opacity='0.15';r.setAttribute('stroke-width','1');}});
  const descs=[...my].map(lid=>D[lid]).filter(Boolean);
  const gr=id.slice(0,3);
  const col=GC[gr]||'var(--color-text-primary)';
  document.getElementById('cm-inf').innerHTML='<strong style="color:'+col+'">'+LB[id]+'</strong> 的連結關係：<br>'+descs.join('<br>');
}
function rst(){for(let i=0;i<=12;i++){const e=document.getElementById('l'+i);if(e){e.setAttribute('opacity','0.18');e.setAttribute('stroke-width','1.5');}}ALL.forEach(nid=>{const e=document.getElementById('n-'+nid);if(e){e.style.opacity='1';e.querySelector('rect').setAttribute('stroke-width','1');}});}
document.getElementById('cms').addEventListener('click',e=>{if(!e.target.closest('.cmn')&&sel){sel=null;rst();document.getElementById('cm-inf').textContent='點擊任意節點，查看它與其他要素的關聯路徑';}});
window.hn=hn;
})();
</script>
